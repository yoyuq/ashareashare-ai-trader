[project]
name = "ashare-ai-trader"
version = "2.14.0"
description = "AI驱动的A股量化分析助手"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

authors = [
    {name = "A股智能分析Agent Team"}
]

keywords = ["a-share", "quantitative-analysis", "backtesting", "ai-agent", "deepseek"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.8.8",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "pandas-ta>=0.3.14b0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "chromadb>=0.5.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "langchain-deepseek>=1.0.0",
    "openai>=2.0.0",
    "ollama>=0.4.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0.0",
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
    "plotly>=5.20.0",
    "tqdm>=4.66.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipython>=8.0.0",
]

backtest = [
    "backtrader>=1.9.78",
    "vectorbt>=0.5.0",
    "pyfolio>=0.9.2",
]

all = [
    "tushare>=1.4.0",
    "efinance>=0.5.0",
    "mplfinance>=0.12.10b0",
    "streamlit>=1.35.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 默认跳过联网测试(会真实调用付费API); 需要时显式 pytest -m network
addopts = "-m \"not network\""
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests requiring network access",
]
