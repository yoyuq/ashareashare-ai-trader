[project]
name = "ashare-ai-trader"
version = "3.0.0"
description = "AI驱动的A股量化分析助手"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

authors = [
    {name = "A股智能分析Agent Team"}
]

keywords = ["a-share", "quantitative-analysis", "backtesting", "ai-agent", "deepseek"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "akshare>=1.18.0",
    "baostock>=0.8.8",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "scipy>=1.12.0",
    "pandas-ta>=0.3.14b0",
    "chromadb>=0.5.0",
    "langgraph>=1.0.0",
    "openai>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.20.0",
    # v3.1-deerflow 已知冲突说明: akshare 的传递依赖 mootdx 要求 httpx<0.26/tenacity<9,
    # 与本项目 httpx>=0.27 天然不可调和。mootdx 未被本项目代码直接使用 (仅为 akshare
    # 部分 tdx 数据函数所用), 本项目实际走 Baostock/Tencent 主源, 该警告无害, 不降级 httpx。
    "httpx>=0.27.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "plotly>=5.20.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "ipython>=8.0.0",
]

all = [
    "tushare>=1.4.0",
    "streamlit>=1.35.0",
    "mcp>=1.0.0",
    "uiautomation>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
# 逐步放开起点 (P2-6): 第三方依赖 (numpy/pandas/akshare 等) 无类型存根,
# 先全局忽略 missing imports 让 mypy 能跑起来, 后续再逐包收紧。
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
# 默认跳过联网测试(会真实调用付费API); 需要时显式 pytest -m network
addopts = "-m \"not network\""
# marker 注册已统一到 tests/conftest.py::pytest_configure (P2-6)
