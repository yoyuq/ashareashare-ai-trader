name: CI

# v3.0 CI 硬化 — 替代"形同摆设"的旧 CI (mypy if:false / lint continue-on-error /
# 只跑 unit+smoke 漏掉集成与回归测试)。
# 每个 push/PR 到 main 自动:
#   1. 安装项目 + 依赖
#   2. 运行全部非网络测试 (189+ 项, 含对抗修复回归 + 行为测试) — 硬门槛
#   3. 生成覆盖率报告 (仅报告, 门槛后续逐步收紧)
#   4. ruff F821/F823 硬门槛 (未定义名 = 真实崩溃源)
#   5. ruff 全量风格报告 (非阻断, 展示存量债)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (non-network, 硬门槛)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 仅装 dev extra: backtest extra (backtrader/vectorbt/pyfolio) 代码零引用
      # 且旧包在 CI 上有编译/安装风险
      - name: Install project + dev extra
        run: pip install -e ".[dev]" --quiet

      - name: Run all non-network tests with coverage
        run: pytest -m "not network" -q \
          --cov=analysis --cov=data --cov=simulation --cov=backtest \
          --cov=agent --cov=knowledge --cov=models --cov=api \
          --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report (informational)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: Lint (F821/F823 硬门槛)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff --quiet

      - name: Ruff F821/F823 — undefined names (HARD gate)
        run: ruff check . --select=F821,F823 --ignore=E501

      - name: Ruff full E/F/W — debt report (non-blocking)
        run: ruff check . --select=E,F,W --ignore=E501 \
          || echo "::warning::full lint 存在存量债, 仅 F821/F823 为硬门槛"
