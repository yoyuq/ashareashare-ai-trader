# ====== 股票池配置 v2.8 ======
# 分池管理: 不同策略使用不同的股票池

stock_pools:
  # ---- 主股票池: 沪深300 + 中证500 成分股 ----
  default:
    name: "默认池"
    description: "流动性好的大盘中盘股"
    source: ["hs300", "csi500"]
    filter:
      exclude_st: true
      exclude_new_listing_days: 60
      min_daily_amount: 50000000
      max_price: null
      min_price: 2

  small_cap:
    name: "小盘成长池"
    description: "中证1000 + 创业板 + 科创板"
    source: ["csi1000", "chinext", "star_market"]
    filter:
      exclude_st: true
      exclude_new_listing_days: 120
      min_daily_amount: 30000000
      min_total_mv: 1e9
      max_total_mv: 50e9

  limit_up:
    name: "涨停板池"
    description: "当日涨停非ST股票"
    source: ["all_a_share"]
    filter:
      exclude_st: true
      exclude_new_listing_days: 120
      min_daily_amount: 100000000
      max_price: 100

  etf:
    name: "ETF池"
    description: "主流宽基+行业ETF"
    symbols:
      - "sh.510050"   # 上证50ETF
      - "sh.510300"   # 沪深300ETF
      - "sh.510500"   # 中证500ETF
      - "sz.159915"   # 创业板ETF
      - "sh.588000"   # 科创50ETF
      - "sh.510880"   # 红利ETF
      - "sh.512880"   # 证券ETF
      - "sh.512100"   # 1000ETF

