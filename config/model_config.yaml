# ====== 模型路由配置 — 单模型统一调度 (v3.0) ======
# v3.0 (2026-08): 全量迁移到 DeepSeek V4-Flash, 删除 Ollama 本地层与 V4-Pro 层。

models:
  # ---- 唯一模型: DeepSeek V4-Flash (¥1-2/百万tokens) ----
  flash:
    provider: "deepseek"
    model: "deepseek-v4-flash"               # V4-Flash (性价比最高, 1M 上下文)
    api_key: "${DEEPSEEK_API_KEY}"
    base_url: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}"
    max_context_length: 1000000           # 1M context
    max_output_tokens: 16384
    temperature: 0.3
    request_timeout: 90
    # 价格 (2026年7月):
    #   输入: ¥1/M tokens (缓存命中 ¥0.02/M, 1/50)
    #   输出: ¥2/M tokens
    #   高峰(9:00-12:00, 14:00-18:00): ×2 (峰谷定价)
    # 适用任务:
    # - 技术分析/综合研判
    # - 多空辩论/裁判裁决
    # - 策略匹配与评分
    # - 回测结果解读

# ---- 路由规则 (v3.0 统一 flash, 任务类型仅用于成本统计) ----
routing:
  # 高峰时段自动降级: v3.0 单模型无需降级 (价格×2 由成本核算反映)
  peak_hours_pricing:
    enabled: true
    peak_windows:
      - ["09:00", "12:00"]
      - ["14:00", "18:00"]
    multiplier: 2.0

  # 容灾重试
  fallback:
    max_retries: 2
    retry_delay: 1.0

# ---- 成本控制 ----
cost_control:
  daily_budget: 1.0           # 日预算(元)
  monthly_budget: 15.0        # 月预算(元)
  alert_threshold: 0.8        # 使用80%时告警
  cost_tracking: true

  # DeepSeek V4-Flash 定价 (2026-07)
  pricing:
    flash:
      input: 1.0    # ¥/百万tokens
      output: 2.0   # ¥/百万tokens
      cache_hit_input: 0.02  # 缓存命中输入价 (1/50)
    peak_multiplier: 2.0
    peak_hours:
      - ["09:00", "12:00"]
      - ["14:00", "18:00"]
